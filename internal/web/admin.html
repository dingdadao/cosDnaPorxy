/* ================= 证书托管页 ================= */
let CERTS = [], CERT_DEPLOY = null, CERT_UPLOAD = { name:"", cert:"", key:"" };

async function loadCerts() {
  const r = await api("GET", "/api/certs");
  CERTS = r.certs || [];
  try { CERT_DEPLOY = await api("GET", "/api/certs/deploy-config"); } catch (e) { CERT_DEPLOY = null; }
}

function certStatus(c) {
  const d = Number(c.remaining_days);
  if (d <= 0) return { cls:"cert-bad", text:"已过期" };
  if (d < 14) return { cls:"cert-warn", text:`剩余 ${d} 天` };
  return { cls:"cert-ok", text:`剩余 ${d} 天` };
}
function fmtDate(s) {
  if (!s) return "--";
  const d = new Date(s);
  if (isNaN(d)) return s;
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc2(s) { return esc(String(s == null ? "" : s)); }

function renderCerts() {
  const rows = CERTS.map(c => {
    const st = certStatus(c);
    return `<tr>
      <td class="wrap mono" data-label="名称">${esc2(c.name)}</td>
      <td class="wrap mono" data-label="覆盖域名">${(c.domains||[]).map(esc2).join(", ") || "--"}</td>
      <td data-label="来源"><span class="proto ok">${esc2(c.source || "-")}</span></td>
      <td data-label="到期时间">${fmtDate(c.not_after)} <span class="badge-restart ${st.cls}">${st.text}</span></td>
      <td class="mono" data-label="指纹" title="${esc2(c.fingerprint)}">${esc2((c.fingerprint||"").slice(0,16))}…</td>
      <td class="cell-actions" data-label="">
        <button class="btn btn-danger-ghost small" data-action="cert-del" data-name="${esc2(c.name)}">删除</button>
      </td>
    </tr>`;
  }).join("");

  const table = CERTS.length ? `
    <div class="table-wrap">
      <table class="rules">
        <thead><tr><th>名称</th><th>覆盖域名</th><th style="width:88px">来源</th><th style="width:200px">到期时间</th><th style="width:150px">指纹</th><th style="width:90px">操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="count-note">共 ${CERTS.length} 张证书；DoT / DoH / DoH3 共用同一证书来源，按 SNI 自动选择，替换后无需重启。</div>`
    : `<div class="table-wrap"><div class="empty">
        <div class="big">还没有证书</div>
        <div class="sub">上传证书或在下方通过 Webhook 由 certd 类平台自动推送；也可把 &lt;name&gt;.crt / &lt;name&gt;.key 成对放入证书目录后点「重扫目录」。</div>
      </div></div>`;

  const deploy = CERT_DEPLOY ? `
    <div class="field span-2">
      <label>Webhook 地址（certd「Webhook 部署」填此 URL）</label>
      <div style="display:flex;gap:8px">
        <input type="text" class="mono" id="cert-deploy-url" value="${esc2(CERT_DEPLOY.url)}" readonly>
        <button class="btn btn-ghost small" data-action="cert-copy-url">复制</button>
      </div>
      <div class="help">请求方式 ${esc2(CERT_DEPLOY.method)}，Content-Type ${esc2(CERT_DEPLOY.content_type)}；成功判定字符串填 <code>status</code>。字段映射：domain→名称，crt→证书 PEM，key→私钥 PEM，ic→中间证书（可选）。</div>
    </div>` : `<div class="help span-2">Webhook 配置不可用（未配置 token 或证书功能未就绪）。</div>`;

  $("#view").innerHTML = `<div class="view-inner">
    <div class="page-head">
      <h1>证书托管</h1>
      <p>为 DoT / DoH / DoH3 提供证书。私钥仅以 0600 落盘于 <code>${esc2((CFG&&CFG.cert_store_dir)||"./data/certs")}</code>，不入库；更新后热加载，<b>无需重启</b>。</p>
    </div>
    <section class="card">
      <div class="card-head split"><h2>证书列表</h2>
        <button class="btn btn-ghost small" data-action="cert-reload">重扫目录（SSH 更新）</button>
      </div>
      <div class="card-body">${table}</div>
    </section>
    <section class="card">
      <div class="card-head"><h2>上传证书</h2></div>
      <div class="card-body grid">
        <div class="field">
          <label for="cert-name">证书名称</label>
          <input type="text" id="cert-name" class="mono" value="${esc2(CERT_UPLOAD.name)}" placeholder="dns.example.com">
          <div class="help">仅作标识与文件名；同名会覆盖更新。</div>
        </div>
        <div class="field span-2">
          <label for="cert-pem">证书 PEM（可含中间证书链）</label>
          <textarea id="cert-pem" class="mono" rows="5" placeholder="-----BEGIN CERTIFICATE-----">${esc2(CERT_UPLOAD.cert)}</textarea>
        </div>
        <div class="field span-2">
          <label for="cert-key">私钥 PEM</label>
          <textarea id="cert-key" class="mono" rows="5" placeholder="-----BEGIN PRIVATE KEY-----">${esc2(CERT_UPLOAD.key)}</textarea>
        </div>
        <div class="form-actions" style="grid-column:1/-1">
          <button class="btn btn-primary" data-action="cert-upload">上传并热加载</button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Webhook 自动部署</h2></div>
      <div class="card-body grid">${deploy}</div>
    </section>
  </div>`;
  updateChrome();
}

async function uploadCert(btn) {
  const name = $("#cert-name").value.trim();
  const cert = $("#cert-pem").value.trim();
  const key = $("#cert-key").value.trim();
  if (!name) { toast("请填写证书名称", "err"); return; }
  if (!cert || !key) { toast("请粘贴证书与私钥 PEM", "err"); return; }
  CERT_UPLOAD = { name, cert, key };
  btn.classList.add("loading");
  try {
    await api("POST", "/api/certs", { name, cert, key });
    CERT_UPLOAD = { name:"", cert:"", key:"" };
    await loadCerts(); renderCerts();
    toast("证书已上传并热加载", "ok");
  } catch (e) {
    toast("上传失败：" + e.message, "err");
    btn.classList.remove("loading");
  }
}

async function deleteCert(name) {
  const ok = await confirmModal({
    title:"删除证书",
    bodyHTML:`确认删除证书 <code>${esc2(name)}</code>？删除后若仍在被 SNI 使用，握手会回退到默认证书或失败。`,
    confirmText:"删除", danger:true,
  });
  if (!ok) return;
  try {
    await api("DELETE", "/api/certs/" + encodeURIComponent(name));
    await loadCerts(); renderCerts();
    toast("证书已删除", "warn");
  } catch (e) { toast("删除失败：" + e.message, "err"); }
}

async function reloadCerts(btn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "重扫中…"; }
  try {
    const r = await api("POST", "/api/certs/reload");
    await loadCerts(); renderCerts();
    toast(`重扫完成：发现 ${r.scanned} 张证书`, "ok");
  } catch (e) { toast("重扫失败：" + e.message, "err"); }
  finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

function renderRoute() {
  const route = currentRoute();
  document.body.classList.remove("sidebar-open");
  if (route.type === "overrides") {
    buildSidebar("overrides");
    renderOverrides();
  } else if (route.type === "logs") {
    renderQueryLogs();
  } else if (route.type === "stats") {
    renderStats();
  } else if (route.type === "certs") {
    buildSidebar("certs");
    renderCerts();
    loadCerts().then(renderCerts).catch(e => toast("证书加载失败：" + e.message, "err"));
  } else if (route.type === "all") {
    buildSidebar("all");
    renderSettings(SECTIONS.map(s=>s.id), true);
  } else {
    buildSidebar("settings/" + route.id);
    renderSettings([route.id], false);
  }
}

/* ================= 启动 ================= */
(async function init() {
  try {
    const [cfgRes] = await Promise.all([api("GET","/api/config"), loadOverrides()]);
    CFG = humanizeConfig(cfgRes.config);
    BASELINE = clone(CFG);
    if (!location.hash) location.hash = "#/settings/general";
    renderRoute();
  } catch (e) {
    $("#view").innerHTML = `<div class="view-inner"><div class="empty">
      <div class="big">配置加载失败</div><div class="sub">${esc(e.message)}</div>
      <button class="btn btn-ghost" onclick="location.reload()">重新加载</button></div></div>`;
  }
})();
</script>
