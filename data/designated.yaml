  # ===========================================
  # 常用域名配置（原白名单合并）
  # ===========================================
  # 微软 Bing 相关（关键字匹配：覆盖所有含 bing 的域名）
  - "DOMAIN-KEYWORD,bing,default_dns"
  - "DOMAIN-KEYWORD,tbsgcs,default_dns"
  - "DOMAIN-SUFFIX,tbsgcs.com,default_dns"

  # 个人域名（DOMAIN-SUFFIX 覆盖子域名，无需单独配置 fn/qh 子域）
  - "DOMAIN-SUFFIX,niao.fun,default_dns"
  - "DOMAIN-SUFFIX,dpdns.org,default_dns"

  # Cloudflare 中国相关
  - "DOMAIN-SUFFIX,cloudflare-cn.com,default_dns"

