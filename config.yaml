# DNS代理配置文件
listen_port: 5354

# 超时配置（支持2s、2m、2h格式）
timeout: "3s" # DNS查询超时时间
modern_timeout: "2s" # 现代协议(DoH/DoT/H3)查询超时时间

# 上游DNS服务器（支持多种协议，统一URL scheme）
upstream:
  - "udp://119.29.29.29:53" # UDP DNS（阿里）
  - "https://dns.alidns.com/dns-query" # DoH（阿里DNS）
  - "h3://cloudflare-dns.com/dns-query" # DoH3（Cloudflare，会降级到DoH）

cf_cache_time: 24h
replace_cache_time: 60s

# 刷新间隔配置（支持30m、1h、2h格式）
whitelist_refresh: "30m" # 白名单刷新间隔（30分钟）
designated_refresh: "30m" # 定向域名刷新间隔（30分钟）
network_refresh: "24h" # 网络段刷新间隔（24小时）
# Cloudflare和AWS IP段文件
cloudflare_net_file: "./data/cf_mrs_file4.txt"
cloudflare_net_file6: "./data/cf_mrs_file6.txt"
aws_net_file: "./data/aws.txt"

# 替换域名配置
replace_cf_domain: "cf-cname.xingpingcn.top" # 检测到Cloudflare IP时替换的CNAME域名
replace_aws_domain: "cc.cloudfront.182682.xyz" # 检测到AWS IP时替换的CNAME域名

# 白名单和定向域名文件
whitelist_file: "./data/whitelist.txt" # 白名单域名文件：跳过云服务检查的域名列表
designated_domain: "./data/designated.txt" # 定向域名文件：指定使用特定DNS策略的域名列表

# 日志级别
log_level: "debug"

# 缓存配置
cache:
  max_items: 5000 # 最大缓存条目数
  ttl: "1m" # 统一缓存TTL：所有DNS响应的缓存时间
  refresh_threshold: "18s" # 刷新阈值：TTL剩余18秒时开始异步刷新（TTL的30%）
  enable_async_refresh: true # 启用异步刷新：TTL到期前自动刷新DNS记录
  max_async_workers: 5 # 最大异步工作线程数：并发处理异步刷新任务
  eviction_policy: "user_query_time" # 淘汰策略：user_query_time（用户查询时间）
