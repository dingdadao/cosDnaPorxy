# DNS代理配置文件
listen_port: 5354

# 超时配置（支持2s、2m、2h格式）
timeout: "3s" # DNS查询超时时间
modern_timeout: "2s" # 现代协议(DoH/DoT/H3)查询超时时间

# 上游DNS服务器（支持多种协议，统一URL scheme）
upstream:
  - "udp://10.0.0.1:1053" # DoH aliyun

cf_cache_time: 24h
replace_cache_time: 30m
no_answer_cache_time: 10s
max_ip_records: 2 # 云域名替换时的最大IP记录数

# 刷新间隔配置（支持30m、1h、2h格式）
designated_refresh: "30m" # 定向域名刷新间隔（30分钟）
china_domain_refresh: "24h" # 中国域名刷新间隔（24小时）
network_refresh: "24h" # 网络段刷新间隔（24小时）

# Cloudflare和AWS IP段文件
cloudflare_net_file: "./data/cf_mrs_file4.txt"
cloudflare_net_file6: "./data/cf_mrs_file6.txt"
aws_net_file: "./data/aws.txt"

# 替换域名配置
replace_cf_domain: "gotocf.niao.fun" # 检测到Cloudflare IP时替换的CNAME域名
replace_aws_domain: "cc.cloudfront.182682.xyz" # 检测到AWS IP时替换的CNAME域名

# DNS服务器配置
default_dns: "udp://119.29.29.29:53" # 默认DNS服务器（用于未匹配到定向域名的情况）
china_dns: "udp://223.5.5.5:53" # 中国DNS服务器（用于China域名解析）
backup_dns: "udp://114.114.114.114:53" # 备用DNS服务器（用于防污染验证）

# 域名文件配置
designated_domain: "./data/designated.yaml" # 定向域名文件：支持YAML格式（mihomo风格）
designated_domain_url: "https://raw.githubusercontent.com/dingdadao/cosDnaPorxy/refs/heads/master/scripts/shell/designated.yaml" # 定向域名文件URL（优先使用此配置）
china_domain_file: "./data/china_domains.yaml" # 中国域名列表文件
china_domain_file_url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Domain.yaml" # 中国域名列表文件URL（优先使用此配置）

# 日志级别
log_level: "info"

# 缓存配置
cache:
  max_items: 5000 # 最大缓存条目数
  ttl: "1m" # 统一缓存TTL：所有DNS响应的缓存时间
  refresh_threshold: "20s" # 刷新阈值：TTL剩余18秒时开始异步刷新（TTL的30%）
  enable_async_refresh: true # 启用异步刷新：TTL到期前自动刷新DNS记录
  max_async_workers: 2 # 最大异步工作线程数：并发处理异步刷新任务
  eviction_policy: "user_query_time" # 淘汰策略：user_query_time（用户查询时间）
