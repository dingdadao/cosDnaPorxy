# DNS代理配置文件

# 监听端口
listen_port: 5354

# 上游DNS服务器（统一URL scheme：udp:// tcp:// https://(DoH) tls://(DoT) h3://(DoH3)）
upstream:
  - "https://223.5.5.5/dns-query" # 阿里DNS
  - "https://doh.pub/dns-query"   # 腾讯DoH
  - "udp://119.29.29.29:53"       # 腾讯DNS

# 超时配置（支持 2s、2m、2h 格式）
timeout: "1.5s"      # 传统协议(UDP/TCP)查询超时
modern_timeout: "1s" # 现代协议(DoH/DoT/DoH3)查询超时

# 缓存配置
cache:
  max_items: 5000      # 最大缓存条目数
  ttl: "5m"            # 兜底缓存TTL：上游未提供TTL时使用；遵循上游TTL并按缓存时长递减
  max_async_workers: 2 # 异步刷新工作线程数

# 域名数据刷新间隔（支持 30m、1h、24h 格式）
designated_refresh: "30m"   # 定向域名列表刷新间隔
china_domain_refresh: "24h" # 中国域名列表刷新间隔
network_refresh: "24h"      # 云IP段数据文件刷新间隔

# 云IP段数据文件
cloudflare_net_file: "./data/cf_mrs_file4.txt"
cloudflare_net_file6: "./data/cf_mrs_file6.txt"
aws_net_file: "./data/aws.txt"

# 云域名替换：检测到云IP后，将域名解析替换为替换域名的优选IP
replace_cf_domain: "gotocf.niao.fun"           # Cloudflare IP 替换域名
replace_aws_domain: "cc.cloudfront.182682.xyz" # AWS IP 替换域名
replace_cache_time: "30m"                      # 云替换响应缓存时间
max_ip_records: 2                              # 替换域名使用的最大IP数

# 分流DNS服务器
default_dns: "https://223.6.6.6/dns-query" # 定向域名未指定DNS时的默认DNS
china_dns: "udp://223.5.5.5:53"          # 中国域名解析DNS
backup_dns: "udp://114.114.114.114:53"   # 所有上游失败后的备用DNS

# 域名列表文件（URL优先，下载失败时使用本地文件）
designated_domain: "./data/designated.yaml"
designated_domain_url: "https://raw.githubusercontent.com/dingdadao/cosDnaPorxy/refs/heads/master/scripts/shell/designated.yaml"
china_domain_file: "./data/china_domains.yaml"
china_domain_file_url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Domain.yaml"

# 功能开关
enable_china_domain_check: true # 中国域名分流
enable_cloudflare_check: true   # Cloudflare IP 检测与替换
enable_aws_check: false         # AWS IP 检测与替换

# 日志
log_level: "debug"
