################## DNS 上游 ##################

# Google (DoH + DoT + HTTP/3)
- tag: google
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://dns.google/dns-query"
        dial_addr: "2001:4860:4860::8888"
        enable_http3: true
      - addr: "https://dns.google/dns-query"
        dial_addr: "2001:4860:4860::8844"
        enable_http3: true
      - addr: "https://dns.google/dns-query"
        dial_addr: "8.8.8.8"
        enable_http3: true
      - addr: "tls://dns.google"
        dial_addr: "8.8.8.8"
        enable_pipeline: true
      - addr: "tls://dns.google"
        dial_addr: "2001:4860:4860::8888"
        enable_pipeline: true

# Cloudflare (DoH + DoT + HTTP/3)
- tag: cloudflare
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://1.1.1.1/dns-query"
        dial_addr: "1.1.1.1"
        enable_http3: true
      - addr: "https://1.1.1.1/dns-query"
        dial_addr: "2606:4700:4700::1111"
        enable_http3: true
      - addr: "tls://1.1.1.1"
        dial_addr: "1.1.1.1"
        enable_pipeline: true
      - addr: "tls://1.0.0.1"
        dial_addr: "1.0.0.1"
        enable_pipeline: true

# NextDNS (请替换成你自己的 Profile ID)
- tag: nextdns
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://dns.nextdns.io/你的ProfileID"   # ← 替换这里
        dial_addr: "45.90.28.0"
        enable_http3: true
      - addr: "https://dns.nextdns.io/你的ProfileID"
        dial_addr: "2a07:a8c0::"
        enable_http3: true

# Quad9 (无过滤版)
- tag: quad9
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://dns.quad9.net/dns-query"
        dial_addr: "9.9.9.9"
      - addr: "https://dns.quad9.net/dns-query"
        dial_addr: "2620:fe::fe"
      - addr: "tls://dns.quad9.net"
        dial_addr: "9.9.9.9"
        enable_pipeline: true

# 远程节点（机场/自建）
- tag: forward_remote
  type: forward
  args:
    concurrent: 1
    upstreams:
      - addr: "udp://10.0.0.1:1053"   # 你的远程 DNS 地址

# GFW 专用远程
- tag: forward_gfw
  type: forward
  args:
    concurrent: 1
    upstreams:
      - addr: "https://efd0e8b4-0d77-4f5d-b267-b4ec9307f1fc.dingdadao.dpdns.org/feer-go"
        enable_http3: true

# 阿里公共 DNS（国内加速）
- tag: ali
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://dns.alidns.com/dns-query"
        dial_addr: "223.5.5.5"
        enable_http3: true
      - addr: "https://dns.alidns.com/dns-query"
        dial_addr: "223.6.6.6"
        enable_http3: true
      - addr: "tls://dns.alidns.com"
        dial_addr: "223.5.5.5"
        enable_pipeline: true

# DNSPod（腾讯公共 DNS）
- tag: dnspod
  type: forward
  args:
    concurrent: 2
    upstreams:
      - addr: "https://doh.pub/dns-query"
        dial_addr: "1.12.12.12"
      - addr: "https://doh.pub/dns-query"
        dial_addr: "120.53.53.53"
      - addr: "tls://dot.pub"
        dial_addr: "1.12.12.12"
        enable_pipeline: true

# 本地 DNS（运营商或内网）
- tag: local
  type: forward
  args:
    concurrent: 1
    upstreams:
      - addr: "udp://58.20.127.170:53"

# 本地 Cloudflare 代理
- tag: local_cloudflare
  type: forward
  args:
    concurrent: 1
    upstreams:
      - addr: "udp://127.0.0.1:8053"

# 拒绝响应插件（保持不变）
- tag: reject_2
  type: sequence
  args:
    - exec: reject 2

- tag: reject_3
  type: sequence
  args:
    - exec: reject 3

- tag: reject_5
  type: sequence
  args:
    - exec: reject 5