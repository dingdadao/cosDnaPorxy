plugins:
  ################## 数据源（规则集） ##################

  - tag: geoip_private
    type: ip_set
    args:
      files:
        - "/opt/mosdns/rules/geoip_private.txt"

  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - "/opt/mosdns/rules/geoip_cn.txt"

  - tag: geoip_cloudflare
    type: ip_set
    args:
      files:
        - "/opt/mosdns/rules/geoip_cloudflare.txt"

  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/opt/mosdns/rules/geosite_cn.txt"

  - tag: whitelist
    type: domain_set
    args:
      files:
        - "/opt/mosdns/rules/whitelist.txt"

  - tag: geosite_gfw
    type: domain_set
    args:
      files:
        - "/opt/mosdns/rules/geosite_gfw.txt"
        # - "/opt/mosdns/rules/greylist.txt"   # 如需灰名单可打开

  - tag: geosite_geolocation-!cn   # 统一标签名，建议与文件名一致
    type: domain_set
    args:
      files:
        - "/opt/mosdns/rules/geosite_geolocation-!cn.txt"

  - tag: geosite_ads-all
    type: domain_set
    args:
      files:
        - "/opt/mosdns/rules/geosite_category-ads.txt"   # 注意你这里是 category-ads.txt，与前面不一致

  ################## 可执行插件 ##################

  # LAN 缓存（小容量 + 长 TTL，适合内网查询）
  - tag: cache_lan
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400   # 1 天

  # WAN 缓存（大容量 + 长 TTL，适合互联网查询）
  - tag: cache_wan
    type: cache
    args:
      size: 131072
      lazy_cache_ttl: 86400   # 1 天
      # 可选：拒绝缓存一些容易污染的查询类型
      # deny: "qtype 12 || qtype 65 || qtype 255"   # PTR / HTTPS / ANY

  # 无 ECS（保护隐私，不发送 ECS）
  - tag: no_ecs
    type: ecs_handler
    args:
      forward: false
      send: false
      mask4: 24
      mask6: 48

  # 强制附加中国 ECS（用于加速国内上游解析）
  - tag: ecs_cn
    type: ecs_handler
    args:
      forward: true         # 一般不转发下游 ECS
      preset: "220.168.0.1"  # 阿里云公共 DNS 节点（推荐打开）
      send: true
      mask4: 24
      mask6: 48

  # TTL 调整序列（统一命名，更直观）
  - tag: ttl_60s
    type: sequence
    args:
      - exec: ttl 60

  - tag: ttl_300s
    type: sequence
    args:
      - exec: ttl 300

  - tag: ttl_3600s
    type: sequence
    args:
      - exec: ttl 3600