# DNS代理YAML格式定向域名配置文件（mihomo风格）
# 支持DOMAIN、DOMAIN-SUFFIX、DOMAIN-KEYWORD、DOMAIN-REGEX等规则类型
# 格式：规则,DNS服务器（可选，默认使用default_dns）

payload:
  # ===========================================
  # 默认DNS配置（用于没有匹配到定向域名的情况）
  # 此配置在 config.yaml 中的 default_dns 字段设置
  # ===========================================

  # ===========================================
  # 常用域名配置（原白名单合并）
  # ===========================================
  # 微软 Bing 相关 (支持多种匹配模式)
  - "DOMAIN-KEYWORD,bing,default_dns" # 关键字匹配：匹配任何包含 bing 的域名

  # 个人域名
  - "DOMAIN-SUFFIX,niao.fun,default_dns"
  - "DOMAIN,fn.niao.fun,default_dns"
  - "DOMAIN,qh.niao.fun,default_dns"
  - "DOMAIN-SUFFIX,dension.dpdns.org,default_dns"
  # Cloudflare 中国相关
  - "DOMAIN-SUFFIX,cloudflare-cn.com,default_dns"


  # Synology 相关
  - "DOMAIN-SUFFIX,synology.com,default_dns"
  - "DOMAIN-SUFFIX,synology.cn,default_dns"
  - "DOMAIN-SUFFIX,synologydownload.com,default_dns"
  - "DOMAIN-SUFFIX,microsoftonline.com,default_dns"
  - "DOMAIN-SUFFIX,imnks.com,default_dns"
  - "DOMAIN-SUFFIX,microsoft.com,default_dns"
  - "DOMAIN-SUFFIX,baidubce.com,default_dns"


  # ===========================================
  # 局域网域名 - 使用本地DNS服务器（最高优先级）
  # ===========================================

  # ===========================================
  # 海外服务 - 使用海外DNS服务器
  # ===========================================

  # ===========================================
  # 示例：国内常用域名可以加入此处
  # ===========================================
  # 百度系服务

  # 特斯拉相关域名
  - "DOMAIN,tesla.cn,default_dns"
  - "DOMAIN-SUFFIX,tesla.cn,default_dns"
  - "DOMAIN,teslamotors.com,default_dns"
  - "DOMAIN-SUFFIX,teslamotors.com,default_dns"
  - "DOMAIN,mytesla.com,default_dns"
  - "DOMAIN-SUFFIX,akadns.net,default_dns"
  - "DOMAIN-SUFFIX,tl88.net,default_dns"
  - "DOMAIN-SUFFIX,akamaiedge.net,default_dns"
  - "DOMAIN-SUFFIX,cloudinary.com,default_dns"
  - "DOMAIN-SUFFIX,edgekey.net,default_dns"
  - "DOMAIN,tesla.com,default_dns"
  - "DOMAIN-SUFFIX,tesla.com,default_dns"
