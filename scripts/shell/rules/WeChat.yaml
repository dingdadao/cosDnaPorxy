# > WeChat.list（微信相关域名规则集）
# - 分类：即时通信平台 / 加密通讯服务 / 策略分流用途
# - 来源：微信客户端抓包分析 / 实机通信日志 / 安全社区研究报告
# - 特征：识别微信主域名、通信节点、功能接口与遥测通道，覆盖核心服务、SDK 回传、小程序行为及长连接机制
# - 说明：微信域名结构庞大，通信行为复杂，部分服务采用自研加密协议 mmtls（区别于标准 HTTPS），具有规避检测与指纹识别的特征。因此本规则集单独列出，便于持续追踪、行为识别与分类更新。
# - 用途：本规则集用于防御性安全研究，禁止用于任何非法用途
# - 维护：https://github.com/Thoseyearsbrian/Aegis
# - 更新时间：2026-01-12
